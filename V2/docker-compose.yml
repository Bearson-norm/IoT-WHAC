version: '3.8'

# Complete WHAC Fingerprint System Docker Compose
# This file is for reference - each component should be deployed separately

services:
  # Local Machine (Raspberry Pi) - Deploy on Raspberry Pi
  fingerprint-scanner:
    build: ./local_machine
    container_name: whac-fingerprint-scanner
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
      - /dev/serial0:/dev/serial0
      - /dev/ttyACM0:/dev/ttyACM0
    environment:
      - STORE_ID=${STORE_ID:-Store001}
      - MQTT_BROKER=${MQTT_BROKER:-103.87.67.139}
      - MQTT_PORT=${MQTT_PORT:-1883}
      - MQTT_TOPIC=${MQTT_TOPIC:-WHAC/Store001/in}
      - FINGERPRINT_PORT=${FINGERPRINT_PORT:-/dev/serial0}
      - BAUD_RATE=${BAUD_RATE:-57600}
      - CONFIDENCE_THRESHOLD=${CONFIDENCE_THRESHOLD:-50}
      - SCAN_INTERVAL=${SCAN_INTERVAL:-5}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./local_machine/logs:/app/logs
      - ./local_machine/fingerprints.db:/app/fingerprints.db
      - ./local_machine/config.py:/app/config.py:ro
    network_mode: host

  # Database initialization service - runs setup script on every container start
  db-init:
    build:
      context: ./web_ui
      dockerfile: Dockerfile.init
    container_name: whac-db-init
    restart: "no"
    environment:
      - DB_HOST=${DB_HOST:-postgres}
      - DB_NAME=${DB_NAME:-whac_master}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-Admin123}
      - DB_PORT=${DB_PORT:-5432}
    volumes:
      - ./web_ui/database_setup.sql:/app/database_setup.sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  # Web UI (VPS) - Deploy on VPS
  web-ui:
    build: ./web_ui
    container_name: whac-web-ui
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=${DB_HOST:-postgres}
      - DB_NAME=${DB_NAME:-whac_master}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-Admin123}
      - DB_PORT=${DB_PORT:-5432}
      - MQTT_BROKER=${MQTT_BROKER:-103.87.67.139}
      - MQTT_PORT=${MQTT_PORT:-1883}
      - MQTT_ACTION_TOPIC=${MQTT_ACTION_TOPIC:-WHAC/Store001/action}
      - MQTT_SCAN_TOPIC=${MQTT_SCAN_TOPIC:-WHAC/Store001/in}
      - FLASK_ENV=${FLASK_ENV:-production}
      - SECRET_KEY=${SECRET_KEY:-whac_fingerprint_secret_key}
    volumes:
      - ./web_ui/logs:/app/logs
      - ./web_ui/static:/app/static
      - ./web_ui/templates:/app/templates
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      mqtt-broker:

  # Server (VPS) - Deploy on VPS
  mqtt-processor:
    build: ./server
    container_name: whac-mqtt-processor
    restart: unless-stopped
    environment:
      - MQTT_BROKER=${MQTT_BROKER:-103.87.67.139}
      - MQTT_PORT=${MQTT_PORT:-1883}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_NAME=${DB_NAME:-whac_master}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-Admin123}
      - DB_PORT=${DB_PORT:-5432}
      - SCAN_TOPIC=${SCAN_TOPIC:-WHAC/Store001/in}
      - ACTION_TOPIC=${ACTION_TOPIC:-WHAC/Store001/action}
      - STATUS_TOPIC=${STATUS_TOPIC:-WHAC/Store001/status}
    volumes:
      - ./server/logs:/app/logs
      - ./server/central_fingerprints.db:/app/central_fingerprints.db
    depends_on:
      - postgres
      - mqtt-broker

  # Shared PostgreSQL Database (VPS)
  postgres:
    image: postgres:13
    container_name: whac-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_NAME:-whac_master}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-Admin123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./web_ui/database_setup.sql:/docker-entrypoint-initdb.d/01-setup.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-whac_master}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Shared MQTT Broker (VPS)
  mqtt-broker:
    image: eclipse-mosquitto:2.0
    container_name: whac-mqtt-broker
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./web_ui/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "localhost", "-t", "test", "-m", "test"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:

