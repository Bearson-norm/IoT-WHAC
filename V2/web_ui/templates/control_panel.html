<!-- Control Panel untuk Audio & Relay Control -->
<div class="card mb-4">
    <div class="card-header bg-primary text-white">
        <h5 class="mb-0">
            <i class="fas fa-sliders-h me-2"></i>
            System Control Panel
        </h5>
    </div>
    <div class="card-body">
        <div class="row">
            <!-- Audio Control -->
            <div class="col-md-4 mb-3">
                <div class="card h-100 border-info">
                    <div class="card-body text-center">
                        <h6 class="card-title">
                            <i class="fas fa-volume-up text-info"></i>
                            Audio Feedback
                        </h6>
                        <p class="small text-muted">Play audio on local machine</p>
                        <div class="d-grid gap-2">
                            <button class="btn btn-sm btn-info" onclick="playAudio('beep')">
                                <i class="fas fa-bell me-1"></i>Beep
                            </button>
                            <button class="btn btn-sm btn-success" onclick="playAudio('success')">
                                <i class="fas fa-check-circle me-1"></i>Success Sound
                            </button>
                            <button class="btn btn-sm btn-danger" onclick="playAudio('error')">
                                <i class="fas fa-exclamation-circle me-1"></i>Error Sound
                            </button>
                            <button class="btn btn-sm btn-primary" onclick="playAudio('welcome')">
                                <i class="fas fa-hand-wave me-1"></i>Welcome
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Relay Control -->
            <div class="col-md-4 mb-3">
                <div class="card h-100 border-warning">
                    <div class="card-body text-center">
                        <h6 class="card-title">
                            <i class="fas fa-door-open text-warning"></i>
                            Manual Relay Control
                        </h6>
                        <p class="small text-muted">Open relay without fingerprint</p>
                        <div class="d-grid gap-2">
                            <button class="btn btn-sm btn-warning" onclick="openRelay(5)">
                                <i class="fas fa-unlock me-1"></i>Open 5s
                            </button>
                            <button class="btn btn-sm btn-warning" onclick="openRelay(10)">
                                <i class="fas fa-unlock me-1"></i>Open 10s
                            </button>
                            <button class="btn btn-sm btn-warning" onclick="openRelay(30)">
                                <i class="fas fa-unlock me-1"></i>Open 30s
                            </button>
                            <button class="btn btn-sm btn-outline-warning" onclick="openRelayCustom()">
                                <i class="fas fa-cog me-1"></i>Custom Duration
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- System Check -->
            <div class="col-md-4 mb-3">
                <div class="card h-100 border-secondary">
                    <div class="card-body text-center">
                        <h6 class="card-title">
                            <i class="fas fa-stethoscope text-secondary"></i>
                            System Check
                        </h6>
                        <p class="small text-muted">Run self-inspection on local machine</p>
                        <div class="d-grid gap-2">
                            <button class="btn btn-sm btn-secondary" onclick="runSystemCheck()">
                                <i class="fas fa-play-circle me-1"></i>Run Full Check
                            </button>
                            <button class="btn btn-sm btn-outline-secondary" onclick="checkSensors()">
                                <i class="fas fa-fingerprint me-1"></i>Check Sensors
                            </button>
                            <button class="btn btn-sm btn-outline-secondary" onclick="checkMQTTStatus()">
                                <i class="fas fa-network-wired me-1"></i>Check MQTT
                            </button>
                            <button class="btn btn-sm btn-outline-secondary" onclick="checkRelay()">
                                <i class="fas fa-bolt me-1"></i>Check Relay
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Status Display -->
        <div class="alert alert-info mt-3" id="controlPanelStatus" style="display: none;">
            <i class="fas fa-info-circle me-2"></i>
            <span id="controlPanelStatusText"></span>
        </div>
    </div>
</div>

<!-- Custom Duration Modal -->
<div class="modal fade" id="customDurationModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">
                    <i class="fas fa-clock me-2"></i>
                    Custom Relay Duration
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label for="customDuration" class="form-label">Duration (seconds)</label>
                    <input type="number" class="form-control" id="customDuration" 
                           min="1" max="60" value="5" placeholder="Enter duration in seconds">
                    <div class="form-text">Enter duration between 1-60 seconds</div>
                </div>
                <div class="mb-3">
                    <label for="targetDevice" class="form-label">Target Device</label>
                    <select class="form-select" id="targetDevice">
                        <option value="ALL">All Devices</option>
                        <option value="AS608_001">Sensor 1 (Masuk)</option>
                        <option value="AS608_002">Sensor 2 (Keluar)</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-warning" onclick="openRelayWithCustomDuration()">
                    <i class="fas fa-unlock me-1"></i>Open Relay
                </button>
            </div>
        </div>
    </div>
</div>

<script>
// Audio Control Functions
async function playAudio(audioType) {
    try {
        showControlStatus(`Playing ${audioType} audio...`, 'info');
        
        const response = await fetch('/api/play_audio', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                audio_type: audioType
            })
        });
        
        const data = await response.json();
        
        if (response.ok) {
            showControlStatus(`✅ ${data.message}`, 'success');
        } else {
            showControlStatus(`❌ Error: ${data.error}`, 'danger');
        }
    } catch (error) {
        console.error('Error playing audio:', error);
        showControlStatus(`❌ Error: ${error.message}`, 'danger');
    }
}

// Relay Control Functions
async function openRelay(duration) {
    if (!confirm(`Open relay for ${duration} seconds?`)) return;
    
    try {
        showControlStatus(`Opening relay for ${duration} seconds...`, 'info');
        
        const response = await fetch('/api/manual_relay', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                duration: duration,
                device_id: 'ALL'
            })
        });
        
        const data = await response.json();
        
        if (response.ok) {
            showControlStatus(`✅ ${data.message}`, 'success');
        } else {
            showControlStatus(`❌ Error: ${data.error}`, 'danger');
        }
    } catch (error) {
        console.error('Error opening relay:', error);
        showControlStatus(`❌ Error: ${error.message}`, 'danger');
    }
}

function openRelayCustom() {
    const modal = new bootstrap.Modal(document.getElementById('customDurationModal'));
    modal.show();
}

async function openRelayWithCustomDuration() {
    const duration = parseInt(document.getElementById('customDuration').value);
    const device = document.getElementById('targetDevice').value;
    
    if (!duration || duration < 1 || duration > 60) {
        alert('Please enter a duration between 1-60 seconds');
        return;
    }
    
    // Close modal
    bootstrap.Modal.getInstance(document.getElementById('customDurationModal')).hide();
    
    try {
        showControlStatus(`Opening relay for ${duration} seconds on ${device}...`, 'info');
        
        const response = await fetch('/api/manual_relay', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                duration: duration,
                device_id: device
            })
        });
        
        const data = await response.json();
        
        if (response.ok) {
            showControlStatus(`✅ ${data.message}`, 'success');
        } else {
            showControlStatus(`❌ Error: ${data.error}`, 'danger');
        }
    } catch (error) {
        console.error('Error opening relay:', error);
        showControlStatus(`❌ Error: ${error.message}`, 'danger');
    }
}

// System Check Functions
async function runSystemCheck() {
    try {
        showControlStatus('Running system check...', 'info');
        
        const response = await fetch('/api/system_check', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            }
        });
        
        const data = await response.json();
        
        if (response.ok) {
            showControlStatus(`✅ ${data.message}`, 'success');
        } else {
            showControlStatus(`❌ Error: ${data.error}`, 'danger');
        }
    } catch (error) {
        console.error('Error running system check:', error);
        showControlStatus(`❌ Error: ${error.message}`, 'danger');
    }
}

async function checkSensors() {
    showControlStatus('Checking sensors... (playing audio on all sensors)', 'info');
    await playAudio('beep');
}

async function checkRelay() {
    if (!confirm('Test relay? This will open relay for 2 seconds.')) return;
    await openRelay(2);
}

// Status Display Helper
function showControlStatus(message, type) {
    const statusDiv = document.getElementById('controlPanelStatus');
    const statusText = document.getElementById('controlPanelStatusText');
    
    statusDiv.className = `alert alert-${type} mt-3`;
    statusText.textContent = message;
    statusDiv.style.display = 'block';
    
    // Auto-hide after 5 seconds
    setTimeout(() => {
        statusDiv.style.display = 'none';
    }, 5000);
}
</script>
