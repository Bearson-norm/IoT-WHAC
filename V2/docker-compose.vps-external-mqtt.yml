  #     
  #     # Database Configuration
  #     - DB_HOST=${DB_HOST:-postgres}
  #     - DB_NAME=${DB_NAME:-whac_master}
  #     - DB_USER=${DB_USER:-postgres}
  #     - DB_PASSWORD=${DB_PASSWORD:-Admin123}
  #     - DB_PORT=${DB_PORT:-5432}
  #     
  #     # MQTT Topics
  #     - SCAN_TOPIC=${SCAN_TOPIC:-WHAC/Store001/in}
  #     - ACTION_TOPIC=${ACTION_TOPIC:-WHAC/Store001/action}
  #     - STATUS_TOPIC=${STATUS_TOPIC:-WHAC/Store001/status}
  #   
  #   volumes:
  #     - ./server/logs:/app/logs
  #     - ./server/central_fingerprints.db:/app/central_fingerprints.db
  #   
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   
  #   networks:
  #     - whac-network
